<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuit board schematic: DMX512 input through an isolated RS-485 transceiver to a microcontroller driving RGB channels">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ar-bg)"/>
  <ellipse cx="640" cy="500" rx="300" ry="200" fill="#0891b2" opacity="0.10"/>

  <!-- PCB traces -->
  <g fill="none" stroke="#134e4a" stroke-width="2" opacity="0.8">
    <path d="M0 120h120v40h80"/>
    <path d="M0 200h60v120h60"/>
    <path d="M800 140h-90v60h-70"/>
    <path d="M800 460h-140v-60h-60"/>
    <path d="M60 520h140v-60h60"/>
    <path d="M300 560v-40h200v40"/>
  </g>
  <g fill="#0e7490" opacity="0.7">
    <circle cx="120" cy="120" r="4"/><circle cx="60" cy="200" r="4"/><circle cx="710" cy="140" r="4"/>
    <circle cx="660" cy="460" r="4"/><circle cx="200" cy="520" r="4"/>
  </g>

  <!-- DMX input connector -->
  <g transform="translate(56 244)">
    <circle cx="46" cy="46" r="44" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <circle cx="46" cy="46" r="32" fill="#020617" stroke="#334155" stroke-width="2"/>
    <circle cx="34" cy="40" r="5" fill="#64748b"/><circle cx="58" cy="40" r="5" fill="#64748b"/><circle cx="46" cy="58" r="5" fill="#64748b"/>
    <text x="46" y="112" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">DMX IN</text>
    <text x="46" y="130" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">XLR · RS-485</text>
  </g>

  <!-- Signal path -->
  <path d="M148 290h56" stroke="#22d3ee" stroke-width="3"/>
  <path d="M336 290h52" stroke="#22d3ee" stroke-width="3"/>
  <path d="M520 290h44" stroke="#22d3ee" stroke-width="3"/>

  <!-- Optocoupler / transceiver -->
  <g transform="translate(204 246)">
    <rect width="132" height="88" rx="8" fill="#111f36" stroke="#22d3ee" stroke-width="2"/>
    <g fill="#334155">
      <rect x="-8" y="16" width="8" height="8"/><rect x="-8" y="40" width="8" height="8"/><rect x="-8" y="64" width="8" height="8"/>
      <rect x="132" y="16" width="8" height="8"/><rect x="132" y="40" width="8" height="8"/><rect x="132" y="64" width="8" height="8"/>
    </g>
    <text x="66" y="40" font-family="monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">MAX485</text>
    <text x="66" y="60" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">opto-isolated</text>
    <text x="66" y="76" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">250 kbaud</text>
  </g>

  <!-- MCU -->
  <g transform="translate(388 214)">
    <rect width="132" height="152" rx="8" fill="#0f172a" stroke="#0e7490" stroke-width="2"/>
    <rect x="18" y="18" width="96" height="96" rx="4" fill="#020617" stroke="#334155" stroke-width="2"/>
    <circle cx="32" cy="32" r="4" fill="#22d3ee"/>
    <g fill="#334155">
      <rect x="-8" y="30" width="8" height="8"/><rect x="-8" y="54" width="8" height="8"/><rect x="-8" y="78" width="8" height="8"/><rect x="-8" y="102" width="8" height="8"/>
      <rect x="132" y="30" width="8" height="8"/><rect x="132" y="54" width="8" height="8"/><rect x="132" y="78" width="8" height="8"/><rect x="132" y="102" width="8" height="8"/>
    </g>
    <text x="66" y="70" font-family="monospace" font-size="13" fill="#67e8f9" text-anchor="middle">ATmega</text>
    <text x="66" y="88" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">328P</text>
    <text x="66" y="138" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">PWM decode</text>
  </g>

  <!-- RGB output -->
  <g transform="translate(564 208)">
    <rect width="180" height="164" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="52" cy="52" r="26" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <circle cx="128" cy="52" r="26" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <circle cx="90" cy="112" r="26" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="154" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">RGB FIXTURE</text>
  </g>

  <!-- Channel labels -->
  <g font-family="monospace" font-size="11" fill="#475569">
    <text x="232" y="410">ch 1 — red</text>
    <text x="232" y="432">ch 2 — green</text>
    <text x="232" y="454">ch 3 — blue</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <path d="M330 406h180"/><path d="M330 428h180"/><path d="M330 450h180"/>
  </g>

  <text x="400" y="562" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle" letter-spacing="3">DMX512 → PWM DECODER NODE</text>
</svg>
