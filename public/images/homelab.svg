<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology diagram: cloud VPS tunneled to an edge router, core switch and a virtualization cluster">
  <defs>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="hl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="hl-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#hl-bg)"/>
  <rect width="800" height="600" fill="url(#hl-grid)" opacity="0.5"/>
  <ellipse cx="400" cy="90" rx="360" ry="170" fill="#0891b2" opacity="0.12"/>

  <!-- WAN / VPS -->
  <g transform="translate(300 52)">
    <rect width="200" height="62" rx="12" fill="#0f172a" stroke="#0e7490" stroke-width="2"/>
    <path d="M40 38a16 16 0 0 1 3-31 22 22 0 0 1 41-6 17 17 0 0 1 15 37z" fill="#155e75" stroke="#22d3ee" stroke-width="2" transform="translate(-8 -6) scale(0.85)"/>
    <text x="120" y="30" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">Cloud VPS</text>
    <text x="120" y="49" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">static ingress</text>
  </g>

  <!-- WireGuard tunnel -->
  <path d="M400 114 L400 196" stroke="url(#hl-glow)" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="410" y="132" width="128" height="26" rx="13" fill="#083344" stroke="#0e7490"/>
  <text x="474" y="150" font-family="monospace" font-size="12" fill="#67e8f9" text-anchor="middle">WireGuard</text>

  <!-- Edge router -->
  <g transform="translate(280 196)">
    <rect width="240" height="66" rx="10" fill="#111f36" stroke="#22d3ee" stroke-width="2"/>
    <text x="120" y="30" font-family="monospace" font-size="15" fill="#e2e8f0" text-anchor="middle">MikroTik RB5009</text>
    <text x="120" y="50" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">routing · firewall · NAT</text>
    <g fill="#22d3ee" opacity="0.8">
      <rect x="18" y="54" width="12" height="5" rx="1"/><rect x="36" y="54" width="12" height="5" rx="1"/>
      <rect x="54" y="54" width="12" height="5" rx="1"/><rect x="72" y="54" width="12" height="5" rx="1"/>
    </g>
  </g>

  <!-- Router to switch -->
  <path d="M400 262 L400 314" stroke="#334155" stroke-width="3"/>

  <!-- Core switch -->
  <g transform="translate(150 314)">
    <rect width="500" height="58" rx="8" fill="#0f1c30" stroke="#334155" stroke-width="2"/>
    <text x="22" y="34" font-family="monospace" font-size="13" fill="#94a3b8">Dell PowerConnect 6248 ×2</text>
    <g fill="#1e40af" opacity="0.9">
      <rect x="250" y="22" width="9" height="7" rx="1"/><rect x="264" y="22" width="9" height="7" rx="1"/>
      <rect x="278" y="22" width="9" height="7" rx="1"/><rect x="292" y="22" width="9" height="7" rx="1"/>
      <rect x="306" y="22" width="9" height="7" rx="1"/><rect x="320" y="22" width="9" height="7" rx="1"/>
      <rect x="334" y="22" width="9" height="7" rx="1"/><rect x="348" y="22" width="9" height="7" rx="1"/>
      <rect x="250" y="33" width="9" height="7" rx="1"/><rect x="264" y="33" width="9" height="7" rx="1"/>
      <rect x="278" y="33" width="9" height="7" rx="1"/><rect x="292" y="33" width="9" height="7" rx="1"/>
      <rect x="306" y="33" width="9" height="7" rx="1"/><rect x="320" y="33" width="9" height="7" rx="1"/>
      <rect x="334" y="33" width="9" height="7" rx="1"/><rect x="348" y="33" width="9" height="7" rx="1"/>
    </g>
    <circle cx="470" cy="29" r="5" fill="#22d3ee"/>
  </g>

  <!-- VLAN legs -->
  <path d="M240 372 L240 420" stroke="#334155" stroke-width="2"/>
  <path d="M400 372 L400 420" stroke="#334155" stroke-width="2"/>
  <path d="M560 372 L560 420" stroke="#334155" stroke-width="2"/>

  <!-- Cluster nodes -->
  <g font-family="monospace" text-anchor="middle">
    <g transform="translate(160 420)">
      <rect width="160" height="112" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="16" y="18" width="128" height="18" rx="3" fill="#1e293b"/>
      <rect x="16" y="42" width="128" height="18" rx="3" fill="#1e293b"/>
      <rect x="16" y="66" width="128" height="18" rx="3" fill="#1e293b"/>
      <circle cx="30" cy="27" r="4" fill="#22d3ee"/><circle cx="30" cy="51" r="4" fill="#22d3ee"/><circle cx="30" cy="75" r="4" fill="#22d3ee"/>
      <text x="80" y="102" font-size="12" fill="#94a3b8">Proxmox VE</text>
    </g>
    <g transform="translate(320 420)">
      <rect width="160" height="112" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <g fill="#164e63" stroke="#0e7490">
        <rect x="24" y="20" width="50" height="26" rx="4"/><rect x="86" y="20" width="50" height="26" rx="4"/>
        <rect x="24" y="54" width="50" height="26" rx="4"/><rect x="86" y="54" width="50" height="26" rx="4"/>
      </g>
      <text x="80" y="102" font-size="12" fill="#94a3b8">35+ containers</text>
    </g>
    <g transform="translate(480 420)">
      <rect width="160" height="112" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <g fill="none" stroke="#22d3ee" stroke-width="2">
        <ellipse cx="80" cy="30" rx="42" ry="12"/>
        <path d="M38 30v34c0 6.6 18.8 12 42 12s42-5.4 42-12V30"/>
        <path d="M38 48c0 6.6 18.8 12 42 12s42-5.4 42-12"/>
      </g>
      <text x="80" y="102" font-size="12" fill="#94a3b8">40TB+ TrueNAS</text>
    </g>
  </g>

  <text x="400" y="576" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle" letter-spacing="3">HYBRID HOMELAB TOPOLOGY</text>
</svg>
