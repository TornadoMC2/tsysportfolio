<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A phone showing a guest WiFi captive portal, connected to an isolated guest VLAN">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cp-bg)"/>
  <ellipse cx="260" cy="300" rx="300" ry="240" fill="#0891b2" opacity="0.12"/>

  <!-- Signal arcs -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <path d="M300 214a150 150 0 0 1 212 0" stroke-width="4" opacity="0.25"/>
    <path d="M336 250a99 99 0 0 1 140 0" stroke-width="4" opacity="0.45"/>
    <path d="M372 286a48 48 0 0 1 68 0" stroke-width="4" opacity="0.7"/>
  </g>
  <circle cx="406" cy="318" r="9" fill="#22d3ee"/>

  <!-- Phone -->
  <g transform="translate(266 118)">
    <rect width="280" height="420" rx="34" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="14" y="16" width="252" height="388" rx="22" fill="#020617"/>
    <rect x="110" y="26" width="60" height="7" rx="4" fill="#1e293b"/>

    <!-- Portal content mock -->
    <circle cx="140" cy="112" r="30" fill="#083344" stroke="#0e7490" stroke-width="2"/>
    <g fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
      <path d="M126 110a20 20 0 0 1 28 0"/>
      <path d="M132 118a11 11 0 0 1 16 0"/>
    </g>
    <circle cx="140" cy="126" r="3" fill="#22d3ee"/>

    <rect x="62" y="164" width="156" height="14" rx="7" fill="#334155"/>
    <rect x="86" y="188" width="108" height="14" rx="7" fill="#0e7490"/>

    <rect x="40" y="228" width="200" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="56" y="246" width="80" height="9" rx="4" fill="#334155"/>
    <rect x="56" y="266" width="150" height="8" rx="4" fill="#1e293b"/>

    <rect x="40" y="308" width="200" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="56" y="326" width="96" height="9" rx="4" fill="#334155"/>
    <rect x="56" y="346" width="132" height="8" rx="4" fill="#1e293b"/>
  </g>

  <!-- Segmentation panel -->
  <g transform="translate(566 190)" font-family="monospace">
    <rect width="196" height="220" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="20" y="34" font-size="12" fill="#64748b" letter-spacing="2">VLAN POLICY</text>

    <g transform="translate(20 54)">
      <rect width="156" height="38" rx="8" fill="#083344" stroke="#0e7490"/>
      <circle cx="18" cy="19" r="5" fill="#22d3ee"/>
      <text x="34" y="24" font-size="12" fill="#67e8f9">guest</text>
      <text x="120" y="24" font-size="11" fill="#22d3ee">WAN ✓</text>
    </g>
    <g transform="translate(20 102)" opacity="0.55">
      <rect width="156" height="38" rx="8" fill="#1e1b26" stroke="#3f2a2a"/>
      <circle cx="18" cy="19" r="5" fill="#ef4444"/>
      <text x="34" y="24" font-size="12" fill="#94a3b8">mgmt</text>
      <text x="126" y="24" font-size="11" fill="#ef4444">DENY</text>
    </g>
    <g transform="translate(20 150)" opacity="0.55">
      <rect width="156" height="38" rx="8" fill="#1e1b26" stroke="#3f2a2a"/>
      <circle cx="18" cy="19" r="5" fill="#ef4444"/>
      <text x="34" y="24" font-size="12" fill="#94a3b8">storage</text>
      <text x="126" y="24" font-size="11" fill="#ef4444">DENY</text>
    </g>
  </g>

  <text x="400" y="576" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle" letter-spacing="3">ISOLATED GUEST NETWORK</text>
</svg>
