<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A terminal window showing a static site build compiling routes to HTML">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pf-bg)"/>
  <ellipse cx="400" cy="120" rx="360" ry="200" fill="#0891b2" opacity="0.11"/>

  <!-- Terminal window -->
  <g transform="translate(90 108)">
    <rect width="620" height="384" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M0 46h620" stroke="#1e293b" stroke-width="2"/>
    <circle cx="26" cy="24" r="6" fill="#334155"/>
    <circle cx="48" cy="24" r="6" fill="#334155"/>
    <circle cx="70" cy="24" r="6" fill="#334155"/>
    <text x="310" y="29" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">tsys.dev — build</text>

    <g font-family="monospace" font-size="14">
      <text x="28" y="86" fill="#22d3ee">$</text>
      <text x="48" y="86" fill="#e2e8f0">next build</text>

      <text x="28" y="122" fill="#64748b">▲ compiled successfully</text>

      <text x="28" y="160" fill="#475569">Route</text>
      <text x="420" y="160" fill="#475569">Type</text>

      <text x="28" y="192" fill="#94a3b8">○ /</text>
      <text x="420" y="192" fill="#22d3ee">static</text>
      <text x="28" y="220" fill="#94a3b8">○ /about</text>
      <text x="420" y="220" fill="#22d3ee">static</text>
      <text x="28" y="248" fill="#94a3b8">○ /projects</text>
      <text x="420" y="248" fill="#22d3ee">static</text>
      <text x="28" y="276" fill="#94a3b8">● /projects/[slug]</text>
      <text x="420" y="276" fill="#22d3ee">SSG</text>
      <text x="28" y="304" fill="#94a3b8">○ /contact</text>
      <text x="420" y="304" fill="#22d3ee">static</text>
      <text x="28" y="332" fill="#94a3b8">○ /welcome</text>
      <text x="420" y="332" fill="#22d3ee">static</text>

      <text x="28" y="366" fill="#64748b">exported to ./out — 0 server runtime</text>
    </g>
  </g>

  <text x="400" y="540" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle" letter-spacing="3">NEXT.JS · STATIC EXPORT</text>
</svg>
